<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<meta name="color-scheme" content="light dark">
<script>
  /* Day/night: use the visitor's saved choice, otherwise their system setting.
     Runs before the page is drawn, so there is no white flash at night. */
  (function () {
    var t;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  {% include sidebar.html %}
  <main id="main" class="content">
  {{ content }}
  <footer class="foot">&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</footer>
  </main>
</div>
<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    function saved() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
    function show() {
      var dark = root.getAttribute('data-theme') === 'dark';
      btn.title = dark ? 'Switch to day mode' : 'Switch to night mode';
      btn.setAttribute('aria-label', btn.title);
    }
    btn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      show();
    });
    // Until the visitor clicks the switch, follow changes in their system setting.
    var mq = window.matchMedia && matchMedia('(prefers-color-scheme: dark)');
    if (mq && mq.addEventListener) {
      mq.addEventListener('change', function (e) {
        var s = saved();
        if (s !== 'light' && s !== 'dark') { root.setAttribute('data-theme', e.matches ? 'dark' : 'light'); show(); }
      });
    }
    show();
    btn.hidden = false;
  })();
</script>
</body>
</html>
